name: care_connect
description: Care Connect clinic appointment booking app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  intl_phone_field: ^3.2.0
  pinput: ^5.0.0
  intl: ^0.19.0
  device_calendar_plus: ^0.4.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/doctors/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  background_color_android: "#1A0A2E"
  adaptive_icon_background: "#1A0A2E"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1A0A2E"
  image: assets/branding/careconnect_splash.png
  android: true
  ios: true
  web: false
